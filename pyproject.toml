[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "celltransformer2-test"
version = "0.2.0"
description = "CellTransformer2 with Allen 1 MERFISH and BARseq spatial domain discovery examples"
readme = "README.md"
dynamic = ["dependencies"]
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Alex Lee" },
    { name = "Sara Lichtarge" },
    { name = "Aditya Sriram" },
]
maintainers = [{name = "ads303"}]
urls.Homepage = "https://github.com/ads303/celltransformer2-test"
urls.Repository = "https://github.com/ads303/celltransformer2-test"
urls.Issues = "https://github.com/ads303/celltransformer2-test/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
celltransformer-train      = "celltransformer._repo:train_main"
celltransformer-extract    = "celltransformer.extract.main:cli"
celltransformer-preprocess = "celltransformer.preprocess.main:cli"
celltransformer-cluster    = "celltransformer.cluster.main:cli"
celltransformer-smooth     = "celltransformer.smooth.main:cli"

[tool.setuptools.dynamic]
dependencies = {file = ["barseq_example/requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["celltransformer", "celltransformer.*"]
namespaces = false
