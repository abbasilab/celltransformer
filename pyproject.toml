[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "celltransformer2-test"
version = "0.1.0"
description = "CellTransformer2 with a reproducible BARseq spatial domain discovery example"
readme = "README.md"
dynamic = ["dependencies"]
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE", "barseq_example/LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Alex Lee" },
]
maintainers = [{name = "ads303"}]
urls.Homepage = "https://github.com/ads303/celltransformer2-test"
urls.Repository = "https://github.com/ads303/celltransformer2-test"
urls.Issues = "https://github.com/ads303/celltransformer2-test/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
celltransformer-train      = "celltransformer2_barseq.cli:train_main"
celltransformer-extract    = "celltransformer.extract.main:cli"
celltransformer-preprocess = "celltransformer.preprocess.main:cli"
celltransformer-cluster    = "celltransformer.cluster.main:cli"
celltransformer-profile    = "celltransformer.profile.main:cli"
celltransformer-smooth     = "celltransformer.smooth.main:cli"
celltransformer-barseq     = "celltransformer2_barseq.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["barseq_example/requirements.txt", "packaging_requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["celltransformer", "celltransformer.*", "celltransformer2_barseq"]
namespaces = false
