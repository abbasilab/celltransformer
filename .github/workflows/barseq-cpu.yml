name: BARseq source and CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-adapters:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r barseq_example/requirements.txt pytest==8.3.5
      - name: Audit original source and compile
        run: |
          python barseq_example/source_layout.py
          python -m compileall -q src barseq_example scripts
          for script in barseq_example/*.sh; do bash -n "$script"; done
      - name: Check joins, registration lookup and palettes
        run: |
          python barseq_example/test_barseq.py
          python -m pytest -q barseq_example/test_packaging.py
          PYTHONPATH=src python -m pytest -q tests/test_distributions.py tests/test_loader.py tests/test_preprocess.py
      - name: Check finite epochs, checkpoint recovery, metrics and report
        run: python barseq_example/test_adapter.py --output "$RUNNER_TEMP/barseq-synthetic"
