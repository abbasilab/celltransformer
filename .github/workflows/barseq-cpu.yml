name: Allen and BARseq source and CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-adapters:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r barseq_example/requirements.txt pytest==8.3.5
      - name: Audit original source and compile
        run: |
          python barseq_example/source_layout.py
          python allen_example/source_layout.py
          python -m compileall -q src allen_example barseq_example scripts
          for script in allen_example/*.sh barseq_example/*.sh; do bash -n "$script"; done
      - name: Check joins, registration lookup and palettes
        run: |
          python barseq_example/test_barseq.py
          python -m pytest -q barseq_example/test_packaging.py
          python -m pytest -q allen_example/test_data.py allen_example/test_orchestration.py
          PYTHONPATH=src python -m pytest -q tests/test_distributions.py tests/test_loader.py tests/test_preprocess.py
      - name: Check finite epochs, checkpoint recovery, metrics and report
        run: |
          python allen_example/test_adapter.py --output "$RUNNER_TEMP/allen-synthetic"
          python barseq_example/test_adapter.py --output "$RUNNER_TEMP/barseq-synthetic"
      - name: Check pip command routing
        run: PYTHONPATH=src python -m pytest -q tests/test_distribution_cli.py
      - name: Build wheel from source distribution and validate metadata
        run: |
          python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1' 'build==1.2.2.post1' 'twine==6.1.0'
          python -m build --no-isolation
          python -m twine check dist/*
      - name: Install and exercise wheel outside the checkout
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python scripts/check_installed_package.py --output "$RUNNER_TEMP/ct2-installed"
      - name: Upload pip distributions
        uses: actions/upload-artifact@v4
        with:
          name: celltransformer2-pip-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
      - name: Check editable installation preserves source integrity
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          celltransformer-barseq audit
          celltransformer-allen audit
          python barseq_example/source_layout.py
          python allen_example/source_layout.py
          python -c "from celltransformer2_barseq.cli import example_path; assert example_path('allen').name == 'allen_example'; assert example_path('barseq').name == 'barseq_example'"
