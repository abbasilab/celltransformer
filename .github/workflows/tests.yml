name: CellTransformer2 CPU tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r barseq_example/requirements.txt pytest==8.3.5
      - name: Compile source
        run: python -m compileall -q src
      # test_model.py and test_model_regression.py need a GPU (nested tensors are CUDA-only)
      - name: Run CPU tests
        run: PYTHONPATH=src python -m pytest -q tests/test_distributions.py tests/test_loader.py tests/test_preprocess.py
