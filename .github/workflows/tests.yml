name: CellTransformer CPU tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pytest==8.3.5
      - name: Compile source
        run: python -m compileall -q src
      #  tests that need a GPU (model forward passes, torch.compile) are reported as skipped here
      - name: Run CPU tests
        run: PYTHONPATH=src python -m pytest -q -rs tests
