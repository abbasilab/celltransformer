# Main dependency pins used by the successful run; not an exact conda build lock.
channels:
  - rapidsai
  - conda-forge
  - nvidia
dependencies:
  - python=3.11
  - cuml=24.12
  - cudf=24.12
  - cuda-version=12.2
  - numpy=1.26.4
  - scipy=1.14.1
  - numba=0.60.0
  - numba-cuda=0.0.17.1
  - pynvjitlink=0.4.0
  - pip
  - pip:
      - matplotlib==3.9.2
      - seaborn==0.13.2
      - colorcet==3.1.0
      - typer==0.15.2
