# Zhuang ABC Atlas MERFISH data — 4 mice (C57BL6J-1 through 4)
# Per-section files in /data2/alexlee/spatial/data/spatial/zhuang/
#   Mouse 1: 147 sections, 2,846,908 cells
#   Mouse 2:  66 sections
#   Mouse 3:  23 sections
#   Mouse 4:   3 sections, 162,578 cells
#
# Spatial coords: x, y are in MILLIMETRES (range ~3–7 mm).
#   patch_size [0.17, 0.17] ≈ 170 µm window  (~same physical scale as [170, 170] in µm data)
#   patch_size [0.25, 0.25] ≈ 250 µm window
#
# Cell-type labels: 'subclass' column (338 ABC Atlas subclasses).
# Taxonomy YAML: zhuang_338_subclass_taxonomy.yaml
# tissue_section_colname: brain_section_label (Zhuang-specific)
#
# Validation: 3 sections per mouse (mice 1–3), seed=42 over sorted section stems.
# Mouse 4 (only 3 sections total) is train-only.

data_dir: /data2/alexlee/spatial/data/spatial/zhuang/

train_anndata_patterns:
  - "zhuang_C57BL6J_1_*.h5ad"
  - "zhuang_C57BL6J_2_*.h5ad"
  - "zhuang_C57BL6J_3_*.h5ad"
  - "zhuang_C57BL6J_4_*.h5ad"

valid_anndata_patterns:
  # Mouse 1 — rng seed=42 from sorted section list
  - "zhuang_C57BL6J_1_C57BL6J-1_013.h5ad"
  - "zhuang_C57BL6J_1_C57BL6J-1_099.h5ad"
  - "zhuang_C57BL6J_1_C57BL6J-1_116.h5ad"
  # Mouse 2 — rng seed=42
  - "zhuang_C57BL6J_2_C57BL6J-2_006.h5ad"
  - "zhuang_C57BL6J_2_C57BL6J-2_051.h5ad"
  - "zhuang_C57BL6J_2_C57BL6J-2_059.h5ad"
  # Mouse 3 — rng seed=42
  - "zhuang_C57BL6J_3_C57BL6J-3_012.h5ad"
  - "zhuang_C57BL6J_3_C57BL6J-3_019.h5ad"
  - "zhuang_C57BL6J_3_C57BL6J-3_024.h5ad"

# Cell-type label encoding.
cell_type_colname: "subclass"
cell_type_yaml: /data1/alexlee/spatial/data/spatial/taxonomy/zhuang_338_subclass_taxonomy.yaml
tissue_section_colname: "brain_section_label"

batch_size: 256
patch_size: [0.17, 0.17]

workers_per_split: 4
num_splits: 2
prefetch_factor: 12
multiprocessing_method: "thread"
max_tokens: 200000
